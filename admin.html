<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>골목상권 지도 관리자</title>
<style>
  :root{
    --paper:#f6f1e6; --ink:#2b2620; --ink-soft:#6b6255; --line:#d8cfb8;
    --card:#fffdf8; --accent:#c65b3f; --danger:#c0392b; --ok:#3f8a6b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);}
  header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;z-index:10;}
  header h1{font-size:16px;margin:0;}
  #status{font-size:12px;color:var(--ink-soft);}
  #status.ok{color:var(--ok);}
  #status.err{color:var(--danger);}
  main{max-width:1000px;margin:0 auto;padding:20px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  input, select, textarea{
    font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  textarea{width:100%;resize:vertical;}
  button{
    font:inherit;font-weight:700;padding:9px 16px;border-radius:9px;border:none;cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:#efe7d5;color:var(--ink);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;}
  th{color:var(--ink-soft);font-size:12px;text-transform:uppercase;}
  td input, td select{width:100%;min-width:70px;}
  td.actions{white-space:nowrap;}
  .hint{font-size:12px;color:var(--ink-soft);line-height:1.6;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  #tokenBox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  #tokenBox input{width:280px;}
  a.link{color:var(--accent);}

  #authGate{
    position:fixed;inset:0;z-index:2000;background:var(--paper);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .auth-box{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:28px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 8px 24px rgba(43,38,32,.15);
  }
  .auth-box h2{margin:0 0 16px;font-size:16px;}
  .auth-box input{width:100%;margin-bottom:10px;text-align:center;}
  .auth-box button{width:100%;}
  .auth-box .hint{margin-top:10px;min-height:16px;color:var(--danger);}
  #appRoot{display:none;}

  #mapPickWrap{
    position:relative;max-width:480px;margin:0 auto;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;cursor:crosshair;user-select:none;
  }
  #mapPickImg{display:block;width:100%;height:auto;}
  #mapPickDots{position:absolute;inset:0;pointer-events:none;}
  .map-dot{
    position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);
  }
  .map-dot.target{width:18px;height:18px;border-color:var(--ink);box-shadow:0 0 0 3px rgba(43,38,32,.35);}
  #mapPickCoord{
    position:absolute;top:8px;left:8px;background:rgba(43,38,32,.75);color:#fff;font-size:11px;
    padding:3px 8px;border-radius:6px;pointer-events:none;display:none;
  }
  .img-cell{display:flex;align-items:center;gap:6px;min-width:0;}
  .img-cell img.thumb{width:36px;height:36px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none;}
  .img-cell input[type=file]{font-size:11px;flex:1;min-width:0;}
  .img-cell .hint{font-size:10px;line-height:1.3;color:var(--ink-soft);flex:none;}

  .store-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fffdf8;}
  .store-card.target{outline:2px solid var(--accent);}
  /* 24칸 그리드를 두 줄이 공유해서, 서로 다른 필드 구성이어도 칸 경계가 위아래로 맞춰짐 */
  .store-line{display:grid;grid-template-columns:repeat(24, minmax(0,1fr));gap:8px;align-items:center;}
  .store-line + .store-line{margin-top:8px;}
  .store-line .f-name{grid-column:span 4;}
  .store-line .f-cat{grid-column:span 3;}
  .store-line .f-x, .store-line .f-y{grid-column:span 2;}
  .store-line .f-phone{grid-column:span 5;}
  .store-line [data-pin]{grid-column:span 4;}
  .store-line [data-del]{grid-column:span 4;}
  .store-line .f-desc{grid-column:span 10;}
  .store-line .img-cell{grid-column:span 8;}
  .store-line .f-naver{grid-column:span 6;}
  .store-line .f-link{grid-column:span 19;color:var(--ink-soft);font-size:12px;}
  .store-line [data-copylink]{grid-column:span 5;}
  .store-line .btn-ghost, .store-line .btn-danger{padding:8px 6px;font-size:12px;white-space:nowrap;}
  .store-line input, .store-line select{width:100%;min-width:0;box-sizing:border-box;}
  .store-line input[type=number]{-moz-appearance:textfield;}
  .store-line input[type=number]::-webkit-inner-spin-button,
  .store-line input[type=number]::-webkit-outer-spin-button{margin:0;}
  @media (max-width:640px){
    .store-line{grid-template-columns:repeat(12, minmax(0,1fr));}
    .store-line .f-name{grid-column:span 6;}
    .store-line .f-cat{grid-column:span 6;}
    .store-line .f-x, .store-line .f-y{grid-column:span 3;}
    .store-line .f-phone{grid-column:span 6;}
    .store-line [data-pin]{grid-column:span 6;}
    .store-line [data-del]{grid-column:span 6;}
    .store-line .f-desc{grid-column:span 12;}
    .store-line .img-cell{grid-column:span 12;}
    .store-line .f-naver{grid-column:span 12;}
    .store-line .f-link{grid-column:span 8;}
    .store-line [data-copylink]{grid-column:span 4;}
  }
</style>
</head>
<body>
<div id="authGate">
  <div class="auth-box">
    <h2>🔒 관리자 인증</h2>
    <input id="authInput" type="password" placeholder="비밀번호" autocomplete="off">
    <button id="authBtn" class="btn-primary">입장</button>
    <div id="authMsg" class="hint"></div>
  </div>
</div>

<div id="appRoot">
<header>
  <h1>🗂 골목상권 지도 · 관리자</h1>
  <div id="status">초기화 중...</div>
</header>

<main>
  <div class="panel">
    <div class="toolbar">
      <strong>점포 목록 (<span id="countLabel">0</span>개)</strong>
      <div class="row">
        <button id="addBtn" class="btn-ghost">+ 점포 추가</button>
        <button id="reloadBtn" class="btn-ghost">다시 불러오기</button>
        <button id="saveBtn" class="btn-ok">GitHub에 저장</button>
      </div>
    </div>
    <div id="tbody"></div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <strong>🎯 지도에서 좌표 찍기</strong>
      <div class="row">
        <span id="pinHint" class="hint">점포 목록에서 "여기로" 버튼을 누르면 이 지도에서 위치를 클릭해 옮길 수 있습니다.</span>
      </div>
    </div>
    <div id="mapPickWrap">
      <img id="mapPickImg" src="map-illustration.png" alt="지도">
      <div id="mapPickDots"></div>
      <div id="mapPickCoord"></div>
    </div>
  </div>

  <div class="panel">
    <strong>카테고리</strong>
    <div style="overflow-x:auto;margin-top:8px;">
      <table>
        <thead><tr><th style="width:20%">ID</th><th style="width:20%">라벨</th><th style="width:20%">색상</th><th style="width:20%">배경틴트</th><th style="width:10%">삭제</th></tr></thead>
        <tbody id="catTbody"></tbody>
      </table>
    </div>
    <button id="addCatBtn" class="btn-ghost" style="margin-top:8px;">+ 카테고리 추가</button>
  </div>

  <div class="panel">
    <div class="toolbar">
      <strong>GitHub 저장 설정</strong>
      <button id="githubSettingsToggle" class="btn-ghost">열기</button>
    </div>
    <div id="githubSettingsBody" style="display:none;">
      <div id="tokenBox" class="row">
        <input id="repoInput" placeholder="owner/repo" value="wanzanggmail/sc_fashiontown_map">
        <input id="branchInput" placeholder="branch" value="main">
        <input id="tokenInput" type="password" placeholder="GitHub Personal Access Token (repo 쓰기 권한)">
        <button id="saveTokenBtn" class="btn-ghost">토큰 저장</button>
        <button id="clearTokenBtn" class="btn-ghost">토큰 삭제</button>
      </div>
      <p class="hint">
        토큰은 이 브라우저의 localStorage에만 저장되며 서버로 전송되지 않습니다(GitHub API 호출에만 사용).
        <a class="link" href="https://github.com/settings/tokens/new?scopes=repo&description=sc_map_admin" target="_blank" rel="noopener">여기서 발급</a>
        (fine-grained 토큰이면 해당 저장소에 Contents 읽기/쓰기 권한 부여).
      </p>
    </div>
  </div>
</main>
</div>

<script>
/* =========================================================
   비밀번호 인증 (해시만 저장, 평문 비밀번호는 코드에 없음)
========================================================= */
const ADMIN_PW_HASH = 'e5b697d1a51935b0a54316ae32a19d2da13ebd4aec1c1d2116c048c2794058a7';

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

const authGate = document.getElementById('authGate');
const appRoot = document.getElementById('appRoot');
const authInput = document.getElementById('authInput');
const authBtn = document.getElementById('authBtn');
const authMsg = document.getElementById('authMsg');

function unlockApp(){
  authGate.style.display = 'none';
  appRoot.style.display = 'block';
  loadData();
}

async function tryAuth(){
  const hash = await sha256Hex(authInput.value);
  if (hash === ADMIN_PW_HASH) {
    sessionStorage.setItem('sc_admin_authed', '1');
    unlockApp();
  } else {
    authMsg.textContent = '비밀번호가 올바르지 않습니다.';
    authInput.value = '';
    authInput.focus();
  }
}
authBtn.onclick = tryAuth;
authInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryAuth(); });

if (sessionStorage.getItem('sc_admin_authed') === '1') {
  unlockApp();
} else {
  authInput.focus();
}

const STATUS_EL = document.getElementById('status');
function setStatus(msg, cls){
  STATUS_EL.textContent = msg;
  STATUS_EL.className = cls || '';
}

const repoInput = document.getElementById('repoInput');
const branchInput = document.getElementById('branchInput');
const tokenInput = document.getElementById('tokenInput');

repoInput.value = localStorage.getItem('sc_admin_repo') || repoInput.value;
branchInput.value = localStorage.getItem('sc_admin_branch') || branchInput.value;
tokenInput.value = localStorage.getItem('sc_admin_token') || '';

document.getElementById('saveTokenBtn').onclick = () => {
  localStorage.setItem('sc_admin_repo', repoInput.value.trim());
  localStorage.setItem('sc_admin_branch', branchInput.value.trim());
  localStorage.setItem('sc_admin_token', tokenInput.value.trim());
  setStatus('설정 저장됨', 'ok');
};
document.getElementById('clearTokenBtn').onclick = () => {
  localStorage.removeItem('sc_admin_token');
  tokenInput.value = '';
  setStatus('토큰 삭제됨', '');
};

let data = null;   // { categories, imageSize, illustrationURL, stores }
let currentSha = null;

const tbody = document.getElementById('tbody');
const catTbody = document.getElementById('catTbody');
const countLabel = document.getElementById('countLabel');

function ghHeaders(){
  const token = tokenInput.value.trim();
  const h = { 'Accept': 'application/vnd.github+json' };
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}

async function loadData(){
  setStatus('불러오는 중...');
  try {
    const repo = repoInput.value.trim();
    const branch = branchInput.value.trim();
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json?ref=${branch}`, { headers: ghHeaders() });
    if (!res.ok) throw new Error('GitHub API ' + res.status);
    const json = await res.json();
    currentSha = json.sha;
    const content = decodeURIComponent(escape(atob(json.content)));
    data = JSON.parse(content);
    render();
    setStatus('불러오기 완료 (GitHub 기준)', 'ok');
  } catch (err) {
    // 토큰/네트워크 문제 시, 같은 폴더의 data.json으로 폴백 (읽기 전용)
    try {
      const res2 = await fetch('data.json?_=' + Date.now());
      data = await res2.json();
      currentSha = null;
      render();
      setStatus('로컬 data.json 불러옴 (GitHub 저장 불가, 토큰 확인 필요)', 'err');
    } catch (err2) {
      setStatus('불러오기 실패: ' + err.message, 'err');
    }
  }
}

function render(){
  renderCats();
  renderStores();
}

function renderCats(){
  catTbody.innerHTML = '';
  data.categories.forEach((cat, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input data-idx="${idx}" data-f="id" value="${cat.id}"></td>
      <td><input data-idx="${idx}" data-f="label" value="${cat.label}"></td>
      <td><input data-idx="${idx}" data-f="color" value="${cat.color}"></td>
      <td><input data-idx="${idx}" data-f="tint" value="${cat.tint}"></td>
      <td class="actions"><button class="btn-danger" data-del="${idx}">삭제</button></td>
    `;
    catTbody.appendChild(tr);
  });
  catTbody.querySelectorAll('input').forEach(inp => {
    inp.oninput = () => { data.categories[inp.dataset.idx][inp.dataset.f] = inp.value; };
  });
  catTbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => { data.categories.splice(btn.dataset.del, 1); renderCats(); renderStores(); };
  });
}

document.getElementById('addCatBtn').onclick = () => {
  data.categories.push({ id: 'new_cat', label: '새 카테고리', color: '#888888', tint: '#eeeeee' });
  renderCats(); renderStores();
};

function catOptions(selected){
  return data.categories.map(c => `<option value="${c.id}" ${c.id===selected?'selected':''}>${c.label}</option>`).join('');
}

function storeLinkUrl(storeId){
  const base = new URL('.', location.href).href;
  const shortId = storeId.replace(/^store-/, '');
  return base + '?s=' + encodeURIComponent(shortId);
}

function renderStores(){
  tbody.innerHTML = '';
  countLabel.textContent = data.stores.length;
  data.stores.forEach((s, idx) => {
    const card = document.createElement('div');
    card.className = 'store-card' + (idx === pinTargetIdx ? ' target' : '');
    card.innerHTML = `
      <div class="store-line">
        <input class="f-name" data-idx="${idx}" data-f="name" value="${s.name}" placeholder="점포명">
        <select class="f-cat" data-idx="${idx}" data-f="cat">${catOptions(s.cat)}</select>
        <input class="f-x" data-idx="${idx}" data-f="x" type="number" value="${s.x}" placeholder="X">
        <input class="f-y" data-idx="${idx}" data-f="y" type="number" value="${s.y}" placeholder="Y">
        <input class="f-phone" data-idx="${idx}" data-f="phone" value="${s.phone||''}" placeholder="전화번호">
        <button class="btn-ghost" data-pin="${idx}">${idx===pinTargetIdx ? '여기 클릭 대기중' : '여기로'}</button>
        <button class="btn-danger" data-del="${idx}">삭제</button>
      </div>
      <div class="store-line">
        <input class="f-desc" data-idx="${idx}" data-f="description" value="${s.description||''}" placeholder="점포 설명">
        <div class="img-cell">
          <img class="thumb" data-thumb="${idx}" src="${s.image||''}" style="${s.image?'':'display:none'}">
          <input type="file" accept="image/*" data-imgidx="${idx}">
          <div class="hint">권장 800×800px 이상<br>(정사각형, 자동 480px로 축소)</div>
        </div>
        <input class="f-naver" data-idx="${idx}" data-f="naverUrl" value="${s.naverUrl||''}" placeholder="네이버 URL">
      </div>
      <div class="store-line">
        <input class="f-link" data-linkidx="${idx}" value="${storeLinkUrl(s.id)}" readonly>
        <button class="btn-ghost" data-copylink="${idx}">🔗 링크 복사</button>
      </div>
    `;
    tbody.appendChild(card);
  });
  tbody.querySelectorAll('input[data-f],select[data-f]').forEach(el => {
    el.oninput = () => {
      const idx = el.dataset.idx, f = el.dataset.f;
      if (f === 'x' || f === 'y') data.stores[idx][f] = Number(el.value);
      else data.stores[idx][f] = el.value;
      if (f === 'x' || f === 'y' || f === 'cat') renderMapDots();
    };
  });
  tbody.querySelectorAll('[data-imgidx]').forEach(inp => {
    inp.onchange = () => handleImageSelect(inp);
  });
  tbody.querySelectorAll('[data-copylink]').forEach(btn => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.copylink);
      const url = storeLinkUrl(data.stores[idx].id);
      try {
        await navigator.clipboard.writeText(url);
        setStatus(`"${data.stores[idx].name}" 링크를 복사했습니다`, 'ok');
      } catch (e) {
        setStatus('클립보드 복사 실패 - 링크 입력창에서 직접 선택해 복사해주세요', 'err');
      }
    };
  });
  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.del);
      data.stores.splice(idx, 1);
      if (pinTargetIdx === idx) pinTargetIdx = null;
      renderStores();
    };
  });
  tbody.querySelectorAll('[data-pin]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.pin);
      pinTargetIdx = (pinTargetIdx === idx) ? null : idx;
      pinHintEl.textContent = pinTargetIdx === null
        ? '점포 목록에서 "여기로" 버튼을 누르면 이 지도에서 위치를 클릭해 옮길 수 있습니다.'
        : `"${data.stores[idx].name}" 위치를 아래 지도에서 클릭하세요.`;
      renderStores();
      if (pinTargetIdx !== null) {
        document.getElementById('mapPickWrap').scrollIntoView({behavior:'smooth', block:'center'});
      }
    };
  });
  renderMapDots();
}

/* =========================================================
   지도 클릭으로 좌표 찍기
========================================================= */
let pinTargetIdx = null; // null이면 지도 클릭이 무시됨 ("여기로" 버튼으로 활성화)
const mapPickWrap = document.getElementById('mapPickWrap');
const mapPickImg = document.getElementById('mapPickImg');
const mapPickDots = document.getElementById('mapPickDots');
const mapPickCoord = document.getElementById('mapPickCoord');
const pinHintEl = document.getElementById('pinHint');

function renderMapDots(){
  if (!data) return;
  mapPickDots.innerHTML = '';
  data.stores.forEach((s, idx) => {
    const cat = data.categories.find(c => c.id === s.cat);
    const dot = document.createElement('div');
    dot.className = 'map-dot' + (idx === pinTargetIdx ? ' target' : '');
    dot.style.left = (s.x / data.imageSize.w * 100) + '%';
    dot.style.top = (s.y / data.imageSize.h * 100) + '%';
    dot.style.background = cat ? cat.color : '#999';
    dot.title = s.name;
    mapPickDots.appendChild(dot);
  });
}

mapPickWrap.addEventListener('mousemove', (e) => {
  if (!data) return;
  const rect = mapPickImg.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) / rect.width * data.imageSize.w);
  const y = Math.round((e.clientY - rect.top) / rect.height * data.imageSize.h);
  mapPickCoord.textContent = `X:${x} Y:${y}`;
  mapPickCoord.style.display = 'block';
});
mapPickWrap.addEventListener('mouseleave', () => { mapPickCoord.style.display = 'none'; });

mapPickWrap.addEventListener('click', (e) => {
  if (!data) return;
  if (pinTargetIdx === null || !data.stores[pinTargetIdx]) {
    pinHintEl.textContent = '먼저 점포 목록에서 "여기로" 버튼을 눌러 옮길 점포를 선택하세요.';
    return;
  }
  const rect = mapPickImg.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) / rect.width * data.imageSize.w);
  const y = Math.round((e.clientY - rect.top) / rect.height * data.imageSize.h);
  const store = data.stores[pinTargetIdx];
  store.x = x; store.y = y;
  pinHintEl.textContent = `"${store.name}" 좌표를 (${x}, ${y})로 이동했습니다.`;
  pinTargetIdx = null;
  renderStores();
});

document.getElementById('addBtn').onclick = () => {
  const idx = data.stores.length;
  data.stores.push({
    id: 'store-' + Date.now(),
    name: '새 점포',
    cat: data.categories[0] ? data.categories[0].id : '',
    x: Math.round(data.imageSize.w/2), y: Math.round(data.imageSize.h/2),
    phone: '', description: '', image: '', naverUrl: '#'
  });
  pinTargetIdx = idx;
  pinHintEl.textContent = '"새 점포" 위치를 아래 지도에서 클릭하세요.';
  renderStores();
  tbody.lastElementChild && tbody.lastElementChild.querySelector('input').focus();
  document.getElementById('mapPickWrap').scrollIntoView({behavior:'smooth', block:'center'});
};

/* =========================================================
   이미지 업로드 (리사이즈 후 GitHub에 파일로 저장)
========================================================= */
const IMG_MAX_SIZE = 480; // 모바일에 적당한 썸네일 해상도

function resizeImageToDataURL(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('이미지를 열 수 없습니다'));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadFileToGithub(path, base64Content, message){
  const token = tokenInput.value.trim();
  if (!token) throw new Error('GitHub 토큰이 필요합니다');
  const repo = repoInput.value.trim();
  const branch = branchInput.value.trim();
  let sha;
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`, { headers: ghHeaders() });
    if (res.ok) sha = (await res.json()).sha;
  } catch (e) { /* 파일이 없으면 무시 */ }
  const body = { message, content: base64Content, branch };
  if (sha) body.sha = sha;
  const res2 = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method: 'PUT',
    headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res2.ok) {
    const errBody = await res2.json().catch(()=>({}));
    throw new Error(res2.status + ' ' + (errBody.message || ''));
  }
}

async function handleImageSelect(inp){
  const idx = Number(inp.dataset.imgidx);
  const file = inp.files[0];
  if (!file) return;
  setStatus('이미지 리사이즈 중...');
  try {
    const dataUrl = await resizeImageToDataURL(file, IMG_MAX_SIZE);
    const thumb = document.querySelector(`img[data-thumb="${idx}"]`);
    if (thumb) { thumb.src = dataUrl; thumb.style.display = 'block'; }

    setStatus('GitHub에 이미지 업로드 중...');
    const path = `images/${data.stores[idx].id}.jpg`;
    const base64 = dataUrl.split(',')[1];
    await uploadFileToGithub(path, base64, `admin: upload image for ${data.stores[idx].name}`);
    data.stores[idx].image = path;
    setStatus('이미지 업로드 완료 ✓ ("GitHub에 저장"을 눌러 목록 정보도 저장하세요)', 'ok');
  } catch (err) {
    setStatus('이미지 업로드 실패: ' + err.message, 'err');
  }
}

document.getElementById('reloadBtn').onclick = loadData;

const githubSettingsToggle = document.getElementById('githubSettingsToggle');
const githubSettingsBody = document.getElementById('githubSettingsBody');
githubSettingsToggle.onclick = () => {
  const isOpen = githubSettingsBody.style.display !== 'none';
  githubSettingsBody.style.display = isOpen ? 'none' : 'block';
  githubSettingsToggle.textContent = isOpen ? '열기' : '닫기';
};

document.getElementById('saveBtn').onclick = async () => {
  const token = tokenInput.value.trim();
  const repo = repoInput.value.trim();
  const branch = branchInput.value.trim();
  if (!token) { setStatus('저장하려면 GitHub 토큰이 필요합니다', 'err'); return; }
  setStatus('저장 중...');
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2) + '\n')));
    const body = {
      message: 'admin: update data.json',
      content,
      branch
    };
    if (currentSha) body.sha = currentSha;
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
      method: 'PUT',
      headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const errBody = await res.json().catch(()=>({}));
      throw new Error(res.status + ' ' + (errBody.message || ''));
    }
    const json = await res.json();
    currentSha = json.content.sha;
    setStatus('GitHub에 저장 완료 ✓ (Pages 반영까지 1~2분 소요)', 'ok');
  } catch (err) {
    setStatus('저장 실패: ' + err.message, 'err');
  }
};
